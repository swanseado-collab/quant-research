name: BTC Benchmark Longterm
on:
  push:
    branches: [eth-entry-backtest-20260828]
    paths:
      - 'research/btc_benchmark_longterm.py'
      - '.github/workflows/btc-benchmark-longterm.yml'
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python research/btc_benchmark_longterm.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-benchmark-longterm-results
          path: results/btc_benchmark_longterm/
