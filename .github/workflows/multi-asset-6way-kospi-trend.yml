name: Six Asset KOSPI Trend Compare
on:
  push:
    branches: [eth-entry-backtest-20260828]
    paths:
      - research/multi_asset_6way_kospi_trend_compare.py
      - .github/workflows/multi-asset-6way-kospi-trend.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests tabulate yfinance
      - run: PYTHONPATH=. python research/multi_asset_6way_kospi_trend_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: multi-asset-6way-kospi-trend-results
          path: results/multi_asset_6way_kospi_trend
