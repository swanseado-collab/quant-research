name: Hynix complete backtest
on:
  pull_request:
    branches: [main]
  push:
    branches: [hynix-v4-complete]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba
      - name: Run backtest
        run: python hynix_ci.py
      - name: Run accumulation strategy grid
        run: python run_strategy_grid.py
      - name: Run long horizon audit
        run: python long_horizon_audit.py
      - name: Run regime adaptive research
        run: python regime_adaptive_research.py
      - name: Print grid highlights
        run: |
          echo '=== GRID TOP RETURN ==='
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('results_grid/all_864_strategies.csv')
          c=['strategy','med_cagr3','med_cagr5','med_mdd3','med_mdd5','p25_ret3','p25_ret5','loss_rate3','loss_rate5','bh_win_rate3','bh_win_rate5','calmar_like']
          print(d[d.reserve>0].nlargest(20,'avg_med_cagr')[c].to_csv(index=False))
          print('=== LONG HORIZON SUMMARY ===')
          print(pd.read_csv('results_long/long_horizon_summary.csv').to_csv(index=False))
          print('=== REGIME PERIOD COMPARISON ===')
          print(pd.read_csv('results_regime/period_comparison.csv').to_csv(index=False))
          print('=== REGIME START SUMMARY ===')
          print(pd.read_csv('results_regime/start_regime_1y_summary.csv').to_csv(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hynix-regime-adaptive-results
          path: |
            results/
            results_grid/
            results_long/
            results_regime/
