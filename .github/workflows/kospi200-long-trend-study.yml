name: KOSPI200 Long Trend Study
on:
  push:
    branches: [eth-entry-backtest-20260828]
    paths:
      - research/kospi200_long_trend_study.py
      - .github/workflows/kospi200-long-trend-study.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests yfinance
      - name: Normalize datetime precision
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/kospi200_long_trend_study.py')
          s=p.read_text()
          s=s.replace('d["date"] = pd.to_datetime(d["date"]).dt.tz_localize(None)', 'd["date"] = pd.to_datetime(d["date"]).dt.tz_localize(None).astype("datetime64[ns]")')
          s=s.replace('x["available_date"] = x["obs_date"] + pd.Timedelta(days=45)', 'x["available_date"] = (x["obs_date"] + pd.Timedelta(days=45)).astype("datetime64[ns]")')
          p.write_text(s)
          PY
      - run: python research/kospi200_long_trend_study.py
      - uses: actions/upload-artifact@v4
        with:
          name: kospi200-long-trend-results
          path: results/kospi200_long_trend
