name: Execution Taxable OOS Parallel
on:
  push:
    branches: [eth-entry-backtest-20260828]
    paths:
      - 'research/execution_taxable_oos_parallel.py'
      - '.github/workflows/execution-taxable-oos-parallel.yml'
  workflow_dispatch:
jobs:
  oos:
    strategy:
      fail-fast: false
      matrix:
        route: [DIRECT_US, DOMESTIC_ETF]
        notional: [100000000, 300000000, 1000000000]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ROUTE: ${{ matrix.route }}
      NOTIONAL: ${{ matrix.notional }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests tabulate yfinance
      - run: PYTHONPATH=. python research/execution_taxable_oos_parallel.py
      - uses: actions/upload-artifact@v4
        with:
          name: oos-${{ matrix.route }}-${{ matrix.notional }}
          path: results/execution_taxable_oos_parallel/${{ matrix.route }}_${{ matrix.notional }}
