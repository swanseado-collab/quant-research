name: Final Retirement Robust Selection
on:
  push:
    branches: [eth-entry-backtest-20260828]
    paths:
      - research/final_retirement_robust_selection.py
      - .github/workflows/final-retirement-robust-selection.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests tabulate yfinance
      - run: PYTHONPATH=. python research/final_retirement_robust_selection.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-retirement-robust-selection-results
          path: results/final_retirement_robust_selection
