name: Execution Taxable Smoke V3
on:
  push:
    branches: [eth-entry-backtest-20260828]
    paths:
      - 'research/execution_taxable_smoke_v3.py'
      - '.github/workflows/execution-taxable-smoke-v3.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests tabulate yfinance
      - run: PYTHONPATH=. python research/execution_taxable_smoke_v3.py
