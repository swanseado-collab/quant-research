name: Execution Taxable Stage1 V3
on:
  push:
    branches: [eth-entry-backtest-20260828]
    paths:
      - 'research/execution_taxable_stage1_v3.py'
      - '.github/workflows/execution-taxable-stage1-v3.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests tabulate yfinance
      - run: PYTHONPATH=. python research/execution_taxable_stage1_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: execution-taxable-stage1-v3-results
          path: results/execution_taxable_stage1_v3
