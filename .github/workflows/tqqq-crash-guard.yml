name: TQQQ Crash Guard Research

# V28: translate late-entry tactical rules into whole-portfolio risk at several tactical budget sizes.
on:
  push:
    branches:
      - tqqq-crash-guard-research
    paths:
      - 'research/tqqq_crash_guard/backtest_v28_late_entry_portfolio_budget.py'
      - '.github/workflows/tqqq-crash-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tqqq-crash-guard-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy yfinance
      - name: Run V28 portfolio budget
        run: python research/tqqq_crash_guard/backtest_v28_late_entry_portfolio_budget.py
      - name: Commit results to research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/tqqq_crash_guard/results_v28_late_entry_portfolio_budget
          if git diff --cached --quiet; then
            echo 'No result changes to commit'
          else
            git commit -m 'Add TQQQ V28 late-entry portfolio budget results [skip ci]'
            git push origin HEAD:tqqq-crash-guard-research
          fi
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-v28-late-entry-portfolio-budget-results
          path: research/tqqq_crash_guard/results_v28_late_entry_portfolio_budget
