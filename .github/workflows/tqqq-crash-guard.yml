name: TQQQ Crash Guard Research

# V21: late-stage bull adoption policies: partial join, pullback join, or wait for next crash.
on:
  push:
    branches:
      - tqqq-crash-guard-research
    paths:
      - 'research/tqqq_crash_guard/backtest_v21_late_join_policies.py'
      - '.github/workflows/tqqq-crash-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tqqq-crash-guard-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy yfinance
      - name: Run V21 late join policies
        run: python research/tqqq_crash_guard/backtest_v21_late_join_policies.py
      - name: Commit results to research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/tqqq_crash_guard/results_v21_late_join_policies
          if git diff --cached --quiet; then
            echo 'No result changes to commit'
          else
            git commit -m 'Add TQQQ V21 late-join policy results [skip ci]'
            git push origin HEAD:tqqq-crash-guard-research
          fi
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-v21-late-join-policy-results
          path: research/tqqq_crash_guard/results_v21_late_join_policies
