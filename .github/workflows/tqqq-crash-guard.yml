name: TQQQ Crash Guard Research

# V25: test whether the late-entry early-exit result is a broad MA/slope plateau rather than one lucky parameter point.
on:
  push:
    branches:
      - tqqq-crash-guard-research
    paths:
      - 'research/tqqq_crash_guard/backtest_v25_late_entry_parameter_robustness.py'
      - '.github/workflows/tqqq-crash-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tqqq-crash-guard-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy yfinance
      - name: Run V25 parameter robustness
        run: python research/tqqq_crash_guard/backtest_v25_late_entry_parameter_robustness.py
      - name: Commit results to research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/tqqq_crash_guard/results_v25_late_entry_robustness
          if git diff --cached --quiet; then
            echo 'No result changes to commit'
          else
            git commit -m 'Add TQQQ V25 late-entry robustness results [skip ci]'
            git push origin HEAD:tqqq-crash-guard-research
          fi
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-v25-late-entry-robustness-results
          path: research/tqqq_crash_guard/results_v25_late_entry_robustness
