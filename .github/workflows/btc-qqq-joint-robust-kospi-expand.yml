name: BTC QQQ Joint Robust KOSPI Expand
on:
  push:
    branches: [eth-entry-backtest-20260828]
    paths:
      - research/btc_qqq_joint_robust_kospi_expand.py
      - .github/workflows/btc-qqq-joint-robust-kospi-expand.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests tabulate yfinance
      - run: PYTHONPATH=. python research/btc_qqq_joint_robust_kospi_expand.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-qqq-joint-robust-kospi-expand-results
          path: results/btc_qqq_joint_robust_kospi_expand
