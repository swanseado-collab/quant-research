name: Execution Local Riskoff Stage2
on:
  push:
    branches: [eth-entry-backtest-20260828]
    paths:
      - 'research/execution_local_riskoff_stage2.py'
      - '.github/workflows/execution-local-riskoff-stage2.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests tabulate yfinance
      - run: PYTHONPATH=. python research/execution_local_riskoff_stage2.py
      - uses: actions/upload-artifact@v4
        with:
          name: execution-local-riskoff-stage2-results
          path: results/execution_local_riskoff_stage2
