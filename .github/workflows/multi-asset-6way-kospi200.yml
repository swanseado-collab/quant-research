name: Six Asset KOSPI200 Allocation
on:
  push:
    branches: [eth-entry-backtest-20260828]
    paths:
      - research/multi_asset_6way_kospi200_v2.py
      - .github/workflows/multi-asset-6way-kospi200.yml
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests tabulate yfinance
      - name: Patch matrix orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/multi_asset_6way_kospi200_v2.py')
          s=p.read_text()
          old="m.tbill_sleeve(d,s,e)])\n        dates="
          new="m.tbill_sleeve(d,s,e)]).T\n        dates="
          if old not in s:
              raise SystemExit('patch target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: PYTHONPATH=. python research/multi_asset_6way_kospi200_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: multi-asset-6way-kospi200-results
          path: results/multi_asset_6way_kospi200
